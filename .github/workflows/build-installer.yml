name: Build installer (.exe)

on:
  push:
    tags: ["v*"]          # e.g. git tag v2.7.31 && git push --tags
  workflow_dispatch:

permissions:
  contents: write         # needed to attach the .exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read extension version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyVersion=${{ steps.ver.outputs.version }} installer\GCReturnsPro.iss

      - name: Zip the extension (for manual install)
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath dist\GCReturnsPro-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GCReturnsPro-Setup
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GCReturnsPro-Setup.exe
            dist/GCReturnsPro-extension.zip
