<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC Returns Pro – Website</title>
<style>
 :root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--ok:#0a7d33;--bad:#b3261e}
 @media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e8e8;--card:#22252b;--ok:#4cd07d;--bad:#ff8a80}}
 body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:720px;margin:2rem auto;padding:0 1rem}
 .card{background:var(--card);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0}
 button{font:inherit;padding:.5rem .9rem;margin:.2rem .3rem .2rem 0;border-radius:8px;border:1px solid #8886;cursor:pointer}
 pre{white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
 .ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body>
<h1>GC Returns Pro</h1>
<div class="card"><b>Bridge status:</b> <span id="status">checking…</span>
 <div id="install" hidden><p>Install the bridge once, then reload this page.</p>
 <a href="https://github.com/A3th0r/NEOGST/releases/latest/download/GCReturnsPro-Setup.exe">Download GCReturnsPro-Setup.exe</a></div></div>
<div class="card"><b>Test the bridge</b><br>
 <button id="btnOpen">Open GST login (background tab)</button>
 <button id="btnTab">Is a GST tab open?</button>
 <button id="btnGstin">Look up a GSTIN…</button>
 <pre id="out"></pre></div>
<p><small>Independent tool, not affiliated with GSTN. Your data stays in your browser; no server is used.</small></p>
<script>
// Extension IDs to try: the dev/unpacked ID below, plus the Chrome Web Store ID once you publish.
const EXTENSION_IDS = ["jgbigkbpalolljkpdccfkpagjghcpkol"];
let extId = null;
const out = document.getElementById("out"), show = v => out.textContent = JSON.stringify(v, null, 2);
function send(id, msg) {
  return new Promise(res => {
    if (!(window.chrome && chrome.runtime && chrome.runtime.sendMessage)) return res({ok:false,error:"Use Chrome or Edge on desktop"});
    try { chrome.runtime.sendMessage(id, msg, r => res(chrome.runtime.lastError ? {ok:false,error:chrome.runtime.lastError.message} : r)); }
    catch (e) { res({ok:false,error:String(e)}); }
  });
}
async function bridge(msg) { return extId ? send(extId, msg) : {ok:false,error:"Bridge not installed"}; }
(async () => {
  for (const id of EXTENSION_IDS) { const r = await send(id, {action:"ping"}); if (r && r.ok) { extId = id; break; } }
  const s = document.getElementById("status");
  if (extId) { s.textContent = "connected ✓"; s.className = "ok"; }
  else { s.textContent = "not installed"; s.className = "bad"; document.getElementById("install").hidden = false; }
})();
document.getElementById("btnOpen").onclick = async () => show(await bridge({action:"open-portal", background:true}));
document.getElementById("btnTab").onclick = async () => show(await bridge({action:"gst-tab-status"}));
document.getElementById("btnGstin").onclick = async () => { const g = prompt("GSTIN"); if (g) show(await bridge({action:"taxpayer-search", gstin:g})); };
</script></body></html>
